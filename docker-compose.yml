services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    container_name: meet-space-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

  meetspace-backend:
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_URLS=http://+:8080
    container_name: meetspace-backend
    image: meetspace-backend:1.0.0
    build:
      context: ./Backend/MeetSpace
      dockerfile: Dockerfile
    env_file:
      - ./Backend/MeetSpace/.env
    ports:
      - "5200:8080"
    depends_on:
      - postgres-db

  postgres-db:
    container_name: meetspace-postgres-db
    image: postgres:18.1-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db-data:/var/lib/postgresql
    ports:
      - "5454:5432"

  meetspace-frontend:
    container_name: meetspace-frontend
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - meetspace-backend

volumes:
  minio-data:
  db-data:
